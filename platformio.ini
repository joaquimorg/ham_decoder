[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
; Opening the monitor must not reset the board (DTR/RTS drive EN/IO0 on the
; DevKitC's auto-reset circuit). Use the RST button to restart.
monitor_rts = 0
monitor_dtr = 0

[env:esp32-s3-devkitc-1]
; ESP32-S3 DevKitC-1 N16R8: 16 MB quad flash + 8 MB octal PSRAM (OPI).
; PSRAM/flash/partition settings live in sdkconfig.defaults.esp32s3.
; Octal PSRAM takes GPIO 33..37 - keep them free.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
