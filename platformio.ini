[platformio]
default_envs = freenove-fnk0104s-es8311

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
; Opening the monitor must not reset the board (DTR/RTS drive EN/IO0 on the
; DevKitC's auto-reset circuit). Use the RST button to restart.
monitor_rts = 0
monitor_dtr = 0
; JS8 text dictionary (data/README.md), embedded in the firmware.
board_build.embed_files = data/jsc_dict.bin

[env:esp32-s3-devkitc-1]
; ESP32-S3 DevKitC-1 N16R8: 16 MB quad flash + 8 MB octal PSRAM (OPI).
; PSRAM/flash/partition settings live in sdkconfig.defaults.esp32s3.
; Octal PSRAM takes GPIO 33..37 - keep them free.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv

[env:freenove-fnk0104s]
; Freenove FNK0104S (4" ESP32-S3 display): ESP32-S3R8 (8 MB octal PSRAM) +
; 16 MB quad flash - the same memory as the N16R8, so the same settings and
; partitions. The USB-C port is the native USB-Serial/JTAG (no UART bridge),
; which is the console; sdkconfig.defaults.fnk0104s selects it.
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
; The board is passed to CMake (src/CMakeLists.txt turns it into
; BOARD_FNK0104S): build_flags would add the picolibc specs a second time.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.fnk0104s -DRX_BOARD=FNK0104S

[env:freenove-fnk0104s-es8311]
; FNK0104S with the radio audio on the ES8311 codec (MIC1P, L3 removed; see
; docs/HARDWARE.md) instead of the internal ADC. The speaker monitor works in
; every FNK0104S env; add -DRX_NO_MONITOR=1 to leave it out.
extends = env:freenove-fnk0104s
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.fnk0104s -DRX_BOARD=FNK0104S -DRX_AUDIO=ES8311
